<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#170a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .boot { font-size: 13px; fill: #00f0ff; opacity: 0; }
    .ok { fill: #39ff88; }
    .b1 { animation: b1 12s infinite; }
    .b2 { animation: b2 12s infinite; }
    .b3 { animation: b3 12s infinite; }
    .b4 { animation: b4 12s infinite; }
    @keyframes b1 { 0%,2%{opacity:0} 4%,88%{opacity:.85} 95%,100%{opacity:0} }
    @keyframes b2 { 0%,9%{opacity:0} 11%,88%{opacity:.85} 95%,100%{opacity:0} }
    @keyframes b3 { 0%,16%{opacity:0} 18%,88%{opacity:.85} 95%,100%{opacity:0} }
    @keyframes b4 { 0%,23%{opacity:0} 25%,88%{opacity:.85} 95%,100%{opacity:0} }
    .bar { transform-box: fill-box; transform-origin: left center; animation: load 12s infinite; }
    @keyframes load { 0%,4%{transform:scaleX(0)} 30%,88%{transform:scaleX(1)} 95%,100%{transform:scaleX(1);opacity:0} }
    .reveal { opacity: 0; animation: reveal 12s infinite; }
    @keyframes reveal { 0%,32%{opacity:0} 38%,88%{opacity:1} 95%,100%{opacity:0} }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { 0%{transform:translateY(-10px)} 100%{transform:translateY(330px)} }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .ring2 { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  </style>

  <!-- fundo -->
  <rect width="900" height="320" rx="14" fill="url(#bg)"/>
  <rect width="900" height="320" rx="14" fill="url(#grid)"/>
  <circle cx="450" cy="170" r="230" fill="url(#glow)" class="pulse"/>

  <!-- moldura -->
  <rect x="1" y="1" width="898" height="318" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.35"/>
  <path d="M20 44V20H44M856 20H880V44M880 276V300H856M44 300H20V276" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

  <!-- anéis HUD -->
  <g opacity="0.55">
    <circle class="ring" cx="790" cy="160" r="70" fill="none" stroke="#7c5cff" stroke-width="2" stroke-dasharray="14 10"/>
    <circle class="ring2" cx="790" cy="160" r="50" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 8"/>
    <circle cx="790" cy="160" r="8" fill="#ff2bd6" class="pulse"/>
  </g>
  <g opacity="0.35">
    <circle class="ring2" cx="110" cy="200" r="55" fill="none" stroke="#ff2bd6" stroke-width="1.5" stroke-dasharray="10 12"/>
    <circle class="ring" cx="110" cy="200" r="38" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 7"/>
  </g>

  <!-- boot log -->
  <text class="boot b1" x="40" y="52">&gt; INICIALIZANDO NÚCLEO...</text>
  <text class="boot b2" x="40" y="72"><tspan class="ok">[ OK ]</tspan> CARREGANDO MÓDULOS: PHP · JS · C# · MySQL</text>
  <text class="boot b3" x="40" y="92"><tspan class="ok">[ OK ]</tspan> CONEXÃO NEURAL ESTABELECIDA</text>
  <text class="boot b4" x="40" y="112"><tspan class="ok">[ OK ]</tspan> SISTEMA ONLINE</text>

  <!-- barra de carregamento -->
  <rect x="40" y="128" width="260" height="6" rx="3" fill="#00f0ff" fill-opacity="0.12"/>
  <rect class="bar" x="40" y="128" width="260" height="6" rx="3" fill="url(#title)"/>

  <!-- título -->
  <g class="reveal">
    <text x="450" y="188" text-anchor="middle" font-size="64" font-weight="bold" fill="url(#title)" filter="url(#neon)" letter-spacing="8">ENZO</text>
    <text x="450" y="222" text-anchor="middle" font-size="18" fill="#9fb4ff" letter-spacing="6">DESENVOLVEDOR DE SISTEMAS</text>
    <text x="450" y="256" text-anchor="middle" font-size="13" fill="#00f0ff" opacity="0.8">// alves-dev1 <tspan class="blink">█</tspan></text>
  </g>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="900" height="3" fill="#00f0ff" opacity="0.18"/>
</svg>
